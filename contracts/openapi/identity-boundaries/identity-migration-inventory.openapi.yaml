openapi: 3.1.0
info:
  title: Identity migration inventory
  version: 1.0.0
paths:
  /api/admin/users/identity-migration-inventory:
    get:
      operationId: GetIdentityMigrationInventory
      summary: Read retained federation associations and migration blockers
      description: Requires users:read. Inventory does not establish ownership or approve migration. Configured credentials are candidates requiring independent access verification.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: providerId
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Inventory ordered by user ID; repeated reads do not mutate associations.
          content:
            application/json:
              schema:
                type: object
                required: [items, totalCount, page, pageSize]
                properties:
                  totalCount: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MigrationUser'
        '400': { description: Invalid pagination or query parameters }
        '401': { description: Authentication required }
        '403': { description: users:read permission required }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    MigrationUser:
      type: object
      required: [userId, displayName, status, hasPasswordCredential, candidateFederationProviderIds, migrationBlocked, recoveryRequired, identities]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        status: { type: string }
        hasPasswordCredential:
          type: boolean
          description: Configuration only. Does not prove ownership, usable access, or safe migration.
        candidateFederationProviderIds:
          type: array
          items: { type: string, format: uuid }
          description: Active providers with association evidence and matching issuer; independent access still requires verification.
        migrationBlocked:
          type: boolean
          description: True whenever any retained association is quarantined, including users with candidate credentials.
        recoveryRequired:
          type: boolean
          description: True when migration is blocked and no enabled-account login candidate is available. False never approves migration.
        identities:
          type: array
          items:
            type: object
            required: [providerId, providerName, subjectId, issuer, associationEvidence, isQuarantined]
            properties:
              providerId: { type: string, format: uuid }
              providerName: { type: string }
              subjectId: { type: string }
              issuer: { type: [string, 'null'] }
              associationEvidence: { type: string, enum: [Unknown, NewAccountProvisioning] }
              isQuarantined: { type: boolean }
