openapi: 3.1.0
info:
  title: Credential boundary cutover
  version: 1.0.0
paths:
  /api/admin/security/credential-cutovers:
    post:
      operationId: ExecuteCredentialCutover
      summary: Invalidate pre-cutover provider sessions and credentials
      description: Requires dedicated administrative credentials, current explicit unrestricted human authority, authentication within five minutes and acknowledgement. Production execution requires the integrated migration prerequisites.
      security:
        - bearer: []
      parameters:
        - in: header
          name: X-OIS-Administrative-Approval
          required: true
          schema:
            type: string
            const: acknowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationId]
              properties:
                operationId: { type: string, format: uuid, description: Stable nonempty identifier reused for retries. }
      responses:
        '200':
          description: Completed operation, or its previously recorded result. Counts do not imply recall at offline validators.
          content:
            application/json:
              schema:
                type: object
                required: [operationId, completedAt, tokens, grants, sessions]
                properties:
                  operationId: { type: string, format: uuid }
                  completedAt: { type: string, format: date-time }
                  tokens: { type: integer, format: int64 }
                  grants: { type: integer, format: int64 }
                  sessions: { type: integer }
        '400': { description: Invalid operation identifier. }
        '401': { description: Missing or invalid administrative credential. }
        '403': { description: Administrative permission, fresh human approval or acknowledgement missing. }
        '500': { description: Completion unconfirmed; inspect recorded state and retry the same operation after fresh authentication. }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
