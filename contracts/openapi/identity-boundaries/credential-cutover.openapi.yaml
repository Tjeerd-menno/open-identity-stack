openapi: 3.1.0
info:
  title: Identity boundary cutover readiness
  version: 1.1.0
security:
  - bearer: []
paths:
  /api/admin/security/cutover-readiness:
    get:
      operationId: GetCredentialCutoverReadiness
      description: Requires users:read, applications:read and sessions:revoke through an approved dedicated-audience administrative client. Audits a current snapshot without invalidating credentials. A ready response is informational; execution rechecks inside its serializable transaction.
      responses:
        '200':
          description: Current inventory and unresolved blockers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preflight' }
        '401': { description: Invalid administrative credential. }
        '403': { description: Missing current authority or client entitlement. }
  /api/admin/security/emergency-access-evidence:
    post:
      operationId: RecordEmergencyAccessEvidence
      description: Records only the authenticated operator's protected local-password session. Requires current unrestricted human authority, authentication within five minutes, active persisted session, current epoch, local login availability and acknowledgement. No supplied user, subject, issuer or session identifier can establish proof.
      parameters:
        - $ref: '#/components/parameters/Approval'
      responses:
        '200':
          description: Actual independently accessible emergency login recorded and audited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmergencyAccess' }
        '401': { description: Invalid administrative credential. }
        '403': { description: Independent local authentication, current authority, session or acknowledgement missing. }
  /api/admin/security/business-resources/{resourceId}/token-window-review:
    put:
      operationId: ReviewResourceTokenWindow
      description: Records a fresh unrestricted human operator's external consumer rehearsal evidence and accepted residual window. External enforcement is not automatically verified. Evidence is tied to the current resource revision and credential epoch.
      parameters:
        - $ref: '#/components/parameters/Approval'
        - in: path
          name: resourceId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mechanism, residualSeconds, evidenceReference]
              properties:
                mechanism: { type: string, enum: [OnlineIntrospection, ConsumerRevocation, OfflineExpiry] }
                residualSeconds: { type: integer, minimum: 0, maximum: 2147483647 }
                evidenceReference: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '204': { description: Review recorded; readiness must be refreshed. }
        '400': { description: Invalid control or window evidence. }
        '401': { description: Invalid administrative credential. }
        '403': { description: Fresh unrestricted human approval missing. }
        '404': { description: Business resource missing. }
  /api/admin/security/credential-cutovers:
    post:
      operationId: ExecuteCredentialCutover
      summary: Invalidate pre-cutover provider sessions and credentials
      description: Requires dedicated administrative credentials, current explicit unrestricted human authority, authentication within five minutes and acknowledgement. The serializable transaction blocks unresolved quarantine, emergency access, client preparation and business resource windows before any invalidation. Publishing this contract does not authorize production execution.
      parameters:
        - $ref: '#/components/parameters/Approval'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operationId]
              properties:
                operationId: { type: string, format: uuid, description: Stable nonempty identifier reused for retries. }
      responses:
        '200':
          description: Completed operation or its previously recorded result. Counts do not imply recall at offline validators.
          content:
            application/json:
              schema:
                type: object
                required: [operationId, completedAt, tokens, grants, sessions]
                properties:
                  operationId: { type: string, format: uuid }
                  completedAt: { type: string, format: date-time }
                  tokens: { type: integer, format: int64 }
                  grants: { type: integer, format: int64 }
                  sessions: { type: integer }
        '400': { description: Invalid operation identifier. }
        '401': { description: Invalid administrative credential. }
        '403': { description: Fresh unrestricted human approval missing. }
        '409': { description: Unresolved live prerequisites; audit persisted without advancing the boundary or revoking credentials. }
        '500': { description: Completion unconfirmed; inspect operation history and retry the same operation identifier after fresh authentication. }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    Approval:
      in: header
      name: X-OIS-Administrative-Approval
      required: true
      schema: { type: string, const: acknowledge }
  schemas:
    EmergencyAccess:
      type: object
      required: [id, userId, sessionId, authenticatedAt, recordedAt, currentlyUsable]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        authenticatedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        currentlyUsable: { type: boolean }
    Preflight:
      type: object
      required: [epoch, evaluatedAt, ready, blockers, emergencyAccess, identities, administrativeClients, businessResources, outstandingAccessTokens, latestAccessTokenExpiry]
      properties:
        epoch: { type: string, format: uuid }
        evaluatedAt: { type: string, format: date-time }
        ready: { type: boolean }
        blockers:
          type: array
          items:
            type: object
            required: [code, message, count]
            properties:
              code: { type: string }
              message: { type: string }
              count: { type: integer }
        emergencyAccess:
          oneOf:
            - $ref: '#/components/schemas/EmergencyAccess'
            - type: 'null'
        identities:
          type: object
          required: [quarantinedLinks, affectedUsers, federationOnlyUsers, passwordCandidates, disabledUsers, verifiedEmails, providerEvidence, withdrawnEvidence]
          properties:
            quarantinedLinks: { type: integer }
            affectedUsers: { type: integer }
            federationOnlyUsers: { type: integer, description: Quarantined users without a configured password; this is not proof of alternative-provider ownership. }
            passwordCandidates: { type: integer, description: Configuration only; never independent authentication proof. }
            disabledUsers: { type: integer }
            verifiedEmails: { type: integer }
            providerEvidence: { type: integer }
            withdrawnEvidence: { type: integer }
        administrativeClients:
          type: array
          items:
            type: object
            required: [id, clientId, active, approved, delegatedPermissions, applicationPermissions, requiresMigrationReview]
            properties:
              id: { type: string, format: uuid }
              clientId: { type: string }
              active: { type: boolean }
              approved: { type: boolean }
              delegatedPermissions: { type: array, items: { type: string } }
              applicationPermissions: { type: array, items: { type: string } }
              requiresMigrationReview: { type: boolean }
        businessResources:
          type: array
          items:
            type: object
            required: [resourceId, displayName, audience, scope, revision, mechanism, residualSeconds, evidenceReference, reviewedAt, reviewed]
            properties:
              resourceId: { type: string, format: uuid }
              displayName: { type: string }
              audience: { type: string }
              scope: { type: string }
              revision: { type: integer, format: int64 }
              mechanism: { type: [string, 'null'] }
              residualSeconds: { type: [integer, 'null'] }
              evidenceReference: { type: [string, 'null'] }
              reviewedAt: { type: [string, 'null'], format: date-time }
              reviewed: { type: boolean }
        outstandingAccessTokens: { type: integer, format: int64, description: All unexpired or unknown-expiry access-token rows including revoked credentials potentially accepted offline. }
        latestAccessTokenExpiry: { type: [string, 'null'], format: date-time }
