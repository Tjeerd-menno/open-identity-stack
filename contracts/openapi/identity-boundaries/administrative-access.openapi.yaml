openapi: 3.1.0
info:
  title: Administrative client entitlement
  version: 1.0.0
  description: Requires an Admin API-only audience, ois.admin scope, current client entitlement, and the endpoint permission.
paths:
  /api/admin/applications/{id}/administrative-access:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: GetAdministrativeAccess
      x-required-permission: applications:read
      responses:
        "200":
          description: Current explicit entitlement, including an unapproved state with empty ceilings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdministrativeAccess" }
        "401": { description: Authentication required }
        "403": { description: Administrative resource or permission boundary denied }
    put:
      operationId: SaveAdministrativeAccess
      x-required-permission: applications:write
      description: Initial approval and expansions require a fresh human all-permissions holder and explicit acknowledgement.
      parameters:
        - name: X-OIS-Administrative-Approval
          in: header
          required: false
          schema: { type: string, enum: [acknowledge] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdministrativeAccessConfiguration" }
      responses:
        "200":
          description: Persisted entitlement and new concurrency revision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdministrativeAccess" }
        "400": { description: Invalid permission ceiling }
        "401": { description: Authentication required }
        "403": { description: Permission denial or AdministrativeApproval Problem Details }
        "409": { description: Expected revision is stale or a concurrent mutation won }
components:
  schemas:
    AdministrativeAccess:
      type: object
      required: [approved, delegatedPermissions, applicationPermissions, revision]
      properties:
        approved: { type: boolean }
        delegatedPermissions: { type: array, items: { type: string } }
        applicationPermissions: { type: array, items: { type: string } }
        revision: { type: [integer, "null"], format: int64 }
    AdministrativeAccessConfiguration:
      type: object
      required: [delegatedPermissions, applicationPermissions, expectedRevision]
      properties:
        delegatedPermissions: { type: array, maxItems: 500, items: { type: string } }
        applicationPermissions: { type: array, maxItems: 500, items: { type: string } }
        expectedRevision: { type: [integer, "null"], format: int64 }
        acknowledgeAdministrativeAccess: { type: boolean, default: false }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
