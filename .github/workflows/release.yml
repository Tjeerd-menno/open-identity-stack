name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/open-identity-stack
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        run: docker build -f src/OpenIdentityStack.Api/Dockerfile -t ${{ env.IMAGE_PREFIX }}-api:${{ env.VERSION }} .

      - name: Build DbMigrator image
        run: docker build -f src/OpenIdentityStack.DbMigrator/Dockerfile -t ${{ env.IMAGE_PREFIX }}-db-migrator:${{ env.VERSION }} .

      - name: Build Admin Web image
        run: docker build -f src/OpenIdentityStack.AdminWeb/Dockerfile -t ${{ env.IMAGE_PREFIX }}-admin-web:${{ env.VERSION }} src/OpenIdentityStack.AdminWeb

      - name: Push images
        run: |
          docker push ${{ env.IMAGE_PREFIX }}-api:${{ env.VERSION }}
          docker push ${{ env.IMAGE_PREFIX }}-db-migrator:${{ env.VERSION }}
          docker push ${{ env.IMAGE_PREFIX }}-admin-web:${{ env.VERSION }}

  windows-service:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish Windows service
        shell: pwsh
        run: |
          $version = "${{ env.VERSION }}"
          dotnet publish src\OpenIdentityStack.Api\OpenIdentityStack.Api.csproj -c Release -r win-x64 --self-contained false -o artifacts\publish
          Copy-Item deploy\windows-service\*.ps1 artifacts\
          Compress-Archive -Path artifacts\publish, artifacts\*.ps1 -DestinationPath "open-identity-stack-api-win-x64-$version.zip"
          Get-FileHash "open-identity-stack-api-win-x64-$version.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Set-Content "open-identity-stack-api-win-x64-$version.zip.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            open-identity-stack-api-win-x64-${{ env.VERSION }}.zip
            open-identity-stack-api-win-x64-${{ env.VERSION }}.zip.sha256
          tag_name: ${{ env.VERSION }}
