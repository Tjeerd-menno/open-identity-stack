name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tjeerd-menno/open-identity-stack
  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  publish-containers:
    name: Publish ${{ matrix.name }} container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: api
            context: .
            dockerfile: src/OpenIdentityStack.Api/Dockerfile
          - name: db-migrator
            image: db-migrator
            context: .
            dockerfile: src/OpenIdentityStack.DbMigrator/Dockerfile
          - name: management-web
            image: management-web
            context: .
            dockerfile: src/OpenIdentityStack.ManagementWeb/Dockerfile
    steps:
      - name: Resolve and validate release version
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$tag'. Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease."
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            git ls-remote --exit-code --tags "https://github.com/$env:GITHUB_REPOSITORY.git" "refs/tags/$tag"
            if (-not $?) {
              throw "Release tag '$tag' does not exist in repository '$env:GITHUB_REPOSITORY'."
            }
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_VERSION=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=OpenIdentityStack ${{ matrix.name }}
            org.opencontainers.image.description=OpenIdentityStack ${{ matrix.name }} container image
            org.opencontainers.image.vendor=Tjeerd-menno
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  windows-service:
    name: Publish Windows service artifact
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Resolve and validate release version
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$tag'. Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease."
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            git ls-remote --exit-code --tags "https://github.com/$env:GITHUB_REPOSITORY.git" "refs/tags/$tag"
            if (-not $?) {
              throw "Release tag '$tag' does not exist in repository '$env:GITHUB_REPOSITORY'."
            }
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_VERSION=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish Windows service
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}"
          dotnet publish src\OpenIdentityStack.Api\OpenIdentityStack.Api.csproj -c Release -r win-x64 --self-contained false /p:Version="${{ env.PACKAGE_VERSION }}" -o artifacts\publish
          Copy-Item deploy\windows-service\*.ps1 artifacts\
          Compress-Archive -Path artifacts\publish, artifacts\*.ps1 -DestinationPath "open-identity-stack-api-win-x64-$version.zip"
          Get-FileHash "open-identity-stack-api-win-x64-$version.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Set-Content "open-identity-stack-api-win-x64-$version.zip.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: |
            open-identity-stack-api-win-x64-${{ env.RELEASE_TAG }}.zip
            open-identity-stack-api-win-x64-${{ env.RELEASE_TAG }}.zip.sha256
          tag_name: ${{ env.RELEASE_TAG }}
