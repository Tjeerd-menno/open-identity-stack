name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tjeerd-menno/open-identity-stack
  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  publish-containers:
    name: Publish ${{ matrix.name }} container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: api
            context: .
            dockerfile: src/OpenIdentityStack.Api/Dockerfile
          - name: db-migrator
            image: db-migrator
            context: .
            dockerfile: src/OpenIdentityStack.DbMigrator/Dockerfile
          - name: admin-web
            image: admin-web
            context: src/OpenIdentityStack.AdminWeb
            dockerfile: src/OpenIdentityStack.AdminWeb/Dockerfile
    steps:
      - name: Resolve and validate release version
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$tag'. Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease."
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            git ls-remote --exit-code --tags "https://github.com/$env:GITHUB_REPOSITORY.git" "refs/tags/$tag"
            if (-not $?) {
              throw "Release tag '$tag' does not exist in repository '$env:GITHUB_REPOSITORY'."
            }
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_VERSION=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=OpenIdentityStack ${{ matrix.name }}
            org.opencontainers.image.description=OpenIdentityStack ${{ matrix.name }} container image
            org.opencontainers.image.vendor=Tjeerd-menno
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  windows-service:
    name: Publish Windows service artifact
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Resolve and validate release version
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version '$tag'. Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease."
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            git ls-remote --exit-code --tags "https://github.com/$env:GITHUB_REPOSITORY.git" "refs/tags/$tag"
            if (-not $?) {
              throw "Release tag '$tag' does not exist in repository '$env:GITHUB_REPOSITORY'."
            }
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_VERSION=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish Windows service
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}"
          dotnet publish src\OpenIdentityStack.Api\OpenIdentityStack.Api.csproj -c Release -r win-x64 --self-contained false /p:Version="${{ env.PACKAGE_VERSION }}" -o artifacts\publish
          Copy-Item deploy\windows-service\*.ps1 artifacts\
          Compress-Archive -Path artifacts\publish, artifacts\*.ps1 -DestinationPath "open-identity-stack-api-win-x64-$version.zip"
          Get-FileHash "open-identity-stack-api-win-x64-$version.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Set-Content "open-identity-stack-api-win-x64-$version.zip.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: |
            open-identity-stack-api-win-x64-${{ env.RELEASE_TAG }}.zip
            open-identity-stack-api-win-x64-${{ env.RELEASE_TAG }}.zip.sha256
          tag_name: ${{ env.RELEASE_TAG }}
