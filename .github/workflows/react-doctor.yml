name: React Doctor

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: lts/*

      - name: Install ManagementWeb dependencies
        working-directory: src/OpenIdentityStack.ManagementWeb
        run: npm ci --ignore-scripts

      - name: Scan ManagementWeb with React Doctor
        working-directory: src/OpenIdentityStack.ManagementWeb
        run: npx --yes react-doctor@0.9.14 . --scope full --yes --verbose --no-telemetry --blocking error --output-dir "$RUNNER_TEMP/react-doctor"
