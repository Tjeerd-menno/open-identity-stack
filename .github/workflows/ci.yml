name: CI

on:
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*

      - name: Verify documentation build
        run: mkdocs build --strict

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet restore OpenIdentityStack.slnx

      - name: Build
        run: env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet build OpenIdentityStack.slnx --no-restore

      - name: Install Playwright browsers
        shell: pwsh
        run: |
          $playwrightScript = "tests/OpenIdentityStack.AdminWeb.E2ETests/bin/Debug/net10.0/playwright.ps1"
          if (-not (Test-Path $playwrightScript)) {
            throw "Playwright install script not found at '$playwrightScript'. Ensure the E2E test project was built successfully."
          }
          pwsh $playwrightScript install --with-deps chromium

      - name: Test unit modules with coverage
        run: |
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Domain.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Application.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/OpenIdentityStack.Infrastructure.Tests/bin/Debug/net10.0/OpenIdentityStack.Infrastructure.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/OpenIdentityStack.Api.UnitTests/bin/Debug/net10.0/OpenIdentityStack.Api.UnitTests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Test API modules sequentially with coverage
        run: |
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Api.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --max-parallel-test-modules 1 --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Contract.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --max-parallel-test-modules 1 --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Test E2E modules sequentially with coverage
        run: env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*E2ETests.dll" --root-directory "$GITHUB_WORKSPACE" --max-parallel-test-modules 1 --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Verify coverage threshold
        run: pwsh scripts/ci/verify-coverage.ps1 -ResultsDir $GITHUB_WORKSPACE/tests -MinimumLineRate 0.10 -MinimumOverallLineRate 0.50
