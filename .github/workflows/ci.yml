name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # Prevent DEBUG_SESSION_PORT from interfering with Aspire DCP
      # See: https://github.com/dotnet/aspire/discussions/5051
      DEBUG_SESSION_PORT: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch base branch for OpenAPI comparison
        if: github.event_name == 'pull_request'
        # Only the base tree is needed for contract comparison; full history is not required.
        run: git fetch --no-tags --prune --depth=1 origin refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

      - name: Check OpenAPI breaking changes
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: scripts/ci/compare-openapi-breaking-changes.ps1 -BaseRef "origin/${{ github.base_ref }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore OpenIdentityStack.slnx

      - name: Build
        run: dotnet build OpenIdentityStack.slnx --no-restore

      - name: Install Playwright browsers
        shell: pwsh
        run: |
          $playwrightScript = "tests/OpenIdentityStack.AdminWeb.E2ETests/bin/Debug/net10.0/playwright.ps1"
          & $playwrightScript install --with-deps chromium

      - name: Test unit modules with coverage
        run: |
          dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Domain.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Application.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          dotnet test --test-modules "tests/OpenIdentityStack.Infrastructure.Tests/bin/Debug/net10.0/OpenIdentityStack.Infrastructure.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          dotnet test --test-modules "tests/OpenIdentityStack.Api.UnitTests/bin/Debug/net10.0/OpenIdentityStack.Api.UnitTests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Test API modules sequentially with coverage
        run: |
          dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Api.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --max-parallel-test-modules 1 --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml
          dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Contract.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --max-parallel-test-modules 1 --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Test E2E modules sequentially with coverage
        run: dotnet test --test-modules "tests/**/bin/Debug/net10.0/*E2ETests.dll" --root-directory "$GITHUB_WORKSPACE" --max-parallel-test-modules 1 --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Verify coverage threshold
        run: pwsh scripts/ci/verify-coverage.ps1 -ResultsDir $GITHUB_WORKSPACE/tests -MinimumLineRate 0.10 -MinimumOverallLineRate 0.50
