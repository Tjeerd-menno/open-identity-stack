name: PR Validation

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: lts/*

      - name: Fetch base branch for OpenAPI comparison
        shell: bash
        run: git fetch --no-tags --prune --depth=1 origin refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

      - name: Check OpenAPI breaking changes
        shell: bash
        # ADR 0005 retires this pre-release workflow; all other contracts remain checked.
        run: >-
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN bash scripts/ci/compare-openapi-breaking-changes.sh
          --base-ref "origin/${{ github.base_ref }}"
          --allow-removed-spec identity-boundaries/credential-cutover.openapi.yaml

      - name: Test CI policies
        run: python3 -m unittest discover -s scripts/ci/tests -p 'test_*.py' -v

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "17"
          distribution: zulu

      - name: Restore
        run: env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet restore OpenIdentityStack.slnx

      - name: Build
        run: env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet build OpenIdentityStack.slnx --no-restore

      - name: Install ManagementWeb dependencies
        working-directory: src/OpenIdentityStack.ManagementWeb
        run: npm ci --ignore-scripts

      - name: Install admin-api-client dependencies
        working-directory: src/frontend-packages/admin-api-client
        run: npm ci --ignore-scripts

      - name: Test admin-api-client
        working-directory: src/frontend-packages/admin-api-client
        run: npm test

      - name: Type-check ManagementWeb
        working-directory: src/OpenIdentityStack.ManagementWeb
        run: npm run type-check

      - name: Lint ManagementWeb
        working-directory: src/OpenIdentityStack.ManagementWeb
        run: npm run lint

      - name: Test ManagementWeb with coverage
        working-directory: src/OpenIdentityStack.ManagementWeb
        run: npm run test:coverage

      - name: Install Playwright browsers for ManagementWeb E2E tests
        shell: pwsh
        run: |
          $playwrightScript = "tests/OpenIdentityStack.ManagementWeb.E2ETests/bin/Debug/net10.0/playwright.ps1"
          if (-not (Test-Path $playwrightScript)) {
            throw "Playwright install script not found at '$playwrightScript'. Ensure the E2E test project was built successfully."
          }
          pwsh $playwrightScript install --with-deps chromium

      - name: Test unit modules with coverage
        run: |
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Domain.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.domain.cobertura.xml --coverage-settings coverage.settings.xml
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Application.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.application.cobertura.xml --coverage-settings coverage.settings.xml
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/OpenIdentityStack.Infrastructure.Tests/bin/Debug/net10.0/OpenIdentityStack.Infrastructure.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.infrastructure.cobertura.xml --coverage-settings coverage.settings.xml
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/OpenIdentityStack.Api.UnitTests/bin/Debug/net10.0/OpenIdentityStack.Api.UnitTests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.apiunit.cobertura.xml --coverage-settings coverage.settings.xml
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/OpenIdentityStack.Architecture.Tests/bin/Debug/net10.0/OpenIdentityStack.Architecture.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore

      - name: Test API modules sequentially with coverage
        run: |
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Api.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --max-parallel-test-modules 1 --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.apitests.cobertura.xml --coverage-settings coverage.settings.xml
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Contract.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --max-parallel-test-modules 1 --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.contract.cobertura.xml --coverage-settings coverage.settings.xml

      - name: Test E2E modules sequentially with coverage
        run: env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*E2ETests.dll" --root-directory "$GITHUB_WORKSPACE" --max-parallel-test-modules 1 --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.e2e.cobertura.xml --coverage-settings coverage.settings.xml

      - name: Verify coverage threshold
        shell: bash
        run: bash scripts/ci/verify-coverage.sh --results-dir "$GITHUB_WORKSPACE/TestResults" --minimum-line-rate 0.10 --minimum-overall-line-rate 0.80
