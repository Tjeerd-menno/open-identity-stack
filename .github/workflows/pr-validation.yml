name: PR Validation

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*

      - name: Fetch base branch for OpenAPI comparison
        shell: bash
        run: git fetch --no-tags --prune --depth=1 origin refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

      - name: Check OpenAPI breaking changes
        shell: bash
        run: env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN bash scripts/ci/compare-openapi-breaking-changes.sh --base-ref "origin/${{ github.base_ref }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Set up JDK 17
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: "17"
          distribution: zulu

      - name: Cache SonarQube packages
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube scanner
        if: ${{ env.SONAR_TOKEN != '' }}
        id: cache-sonar-scanner
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        if: ${{ env.SONAR_TOKEN != '' }}
        shell: pwsh
        run: |
          $scannerPath = "${{ runner.temp }}/scanner"
          $scannerExecutable = Join-Path $scannerPath "dotnet-sonarscanner"

          New-Item -Path $scannerPath -ItemType Directory -Force | Out-Null

          if (Test-Path $scannerExecutable) {
            dotnet tool update dotnet-sonarscanner --tool-path $scannerPath
          }
          else {
            dotnet tool install dotnet-sonarscanner --tool-path $scannerPath
          }

      - name: Begin SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        id: begin-sonarqube
        continue-on-error: true
        shell: pwsh
        run: |
          & "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin `
            /k:"Tjeerd-menno_open-identity-stack" `
            /o:"tjeerdmenno" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.cs.cobertura.reportsPaths="tests/**/coverage.cobertura.xml" `
            /d:sonar.javascript.lcov.reportPaths="src/OpenIdentityStack.ManagementWeb/coverage/lcov.info" `
            /d:sonar.exclusions="src/OpenIdentityStack.Infrastructure/Persistence/Migrations/**,src/OpenIdentityStack.ManagementWeb/coverage/**,src/OpenIdentityStack.ManagementWeb/dist/**" `
            /d:sonar.coverage.exclusions="src/OpenIdentityStack.Infrastructure/Persistence/Migrations/**,src/OpenIdentityStack.DbMigrator/**,src/OpenIdentityStack.AppHost/**,src/OpenIdentityStack.ServiceDefaults/**,src/OpenIdentityStack.ManagementWeb/src/main.tsx"

      - name: Restore
        run: env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet restore OpenIdentityStack.slnx

      - name: Build
        run: env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet build OpenIdentityStack.slnx --no-restore

      - name: Install ManagementWeb dependencies
        working-directory: src/OpenIdentityStack.ManagementWeb
        run: npm ci --ignore-scripts

      - name: Test ManagementWeb with coverage
        working-directory: src/OpenIdentityStack.ManagementWeb
        run: npm run test:coverage

      - name: Install Playwright browsers for ManagementWeb E2E tests
        shell: pwsh
        run: |
          $playwrightScript = "tests/OpenIdentityStack.ManagementWeb.E2ETests/bin/Debug/net10.0/playwright.ps1"
          if (-not (Test-Path $playwrightScript)) {
            throw "Playwright install script not found at '$playwrightScript'. Ensure the E2E test project was built successfully."
          }
          pwsh $playwrightScript install --with-deps chromium

      - name: Test unit modules with coverage
        run: |
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Domain.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --coverage-settings coverage.settings.xml
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Application.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --coverage-settings coverage.settings.xml
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/OpenIdentityStack.Infrastructure.Tests/bin/Debug/net10.0/OpenIdentityStack.Infrastructure.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --coverage-settings coverage.settings.xml
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/OpenIdentityStack.Api.UnitTests/bin/Debug/net10.0/OpenIdentityStack.Api.UnitTests.dll" --root-directory "$GITHUB_WORKSPACE" --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --coverage-settings coverage.settings.xml

      - name: Test API modules sequentially with coverage
        run: |
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Api.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --max-parallel-test-modules 1 --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --coverage-settings coverage.settings.xml
          env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*Contract.Tests.dll" --root-directory "$GITHUB_WORKSPACE" --max-parallel-test-modules 1 --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --coverage-settings coverage.settings.xml

      - name: Test E2E modules sequentially with coverage
        run: env -u DEBUG_SESSION_PORT -u DEBUG_SESSION_TOKEN dotnet test --test-modules "tests/**/bin/Debug/net10.0/*E2ETests.dll" --root-directory "$GITHUB_WORKSPACE" --max-parallel-test-modules 1 --no-build --no-restore -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --coverage-settings coverage.settings.xml

      - name: Verify coverage threshold
        shell: bash
        run: bash scripts/ci/verify-coverage.sh --results-dir "$GITHUB_WORKSPACE/tests" --minimum-line-rate 0.10 --minimum-overall-line-rate 0.50

      - name: End SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' && steps.begin-sonarqube.outcome == 'success' }}
        shell: pwsh
        run: |
          & "${{ runner.temp }}/scanner/dotnet-sonarscanner" end `
            /d:sonar.token="$env:SONAR_TOKEN"
