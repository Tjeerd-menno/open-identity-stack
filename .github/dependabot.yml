version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions-major:
        patterns: ["*"]
        update-types: ["major"]
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # NuGet (.NET backend)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      nuget-major:
        patterns: ["*"]
        update-types: ["major"]
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # npm (Admin Web frontend)
  - package-ecosystem: "npm"
    directory: "/src/OpenIdentityStack.AdminWeb"
    schedule:
      interval: "daily"
    groups:
      npm-radix-ui-major:
        patterns: ["@radix-ui/*"]
        update-types: ["major"]
      npm-radix-ui-minor-patch:
        patterns: ["@radix-ui/*"]
        update-types: ["minor", "patch"]
      npm-tanstack-major:
        patterns: ["@tanstack/*"]
        update-types: ["major"]
      npm-tanstack-minor-patch:
        patterns: ["@tanstack/*"]
        update-types: ["minor", "patch"]
      npm-testing-library-major:
        patterns: ["@testing-library/*"]
        update-types: ["major"]
      npm-testing-library-minor-patch:
        patterns: ["@testing-library/*"]
        update-types: ["minor", "patch"]
      npm-types-major:
        patterns: ["@types/*"]
        update-types: ["major"]
      npm-types-minor-patch:
        patterns: ["@types/*"]
        update-types: ["minor", "patch"]
      npm-vitejs-major:
        patterns: ["@vitejs/*"]
        update-types: ["major"]
      npm-vitejs-minor-patch:
        patterns: ["@vitejs/*"]
        update-types: ["minor", "patch"]
      npm-vitest-major:
        patterns: ["@vitest/*"]
        update-types: ["major"]
      npm-vitest-minor-patch:
        patterns: ["@vitest/*"]
        update-types: ["minor", "patch"]
      npm-unscoped-major:
        patterns: ["*"]
        exclude-patterns: ["@*"]
        update-types: ["major"]
      npm-unscoped-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["@*"]
        update-types: ["minor", "patch"]

  # npm (E2E tests)
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "daily"
    groups:
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
