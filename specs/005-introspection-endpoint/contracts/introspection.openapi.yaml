openapi: 3.1.0
info:
  title: OpenIdentityStack Token Introspection Contract
  version: 0.1.0
  description: OAuth 2.0 token introspection endpoint with caller-filtered permission metadata.
paths:
  /connect/introspect:
    post:
      summary: Introspect an access token
      description: Authenticated API callers validate a token and receive active state plus authorization metadata relevant to the caller.
      operationId: introspectToken
      security:
        - clientCredentials: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Access token to introspect.
                token_type_hint:
                  type: string
                  description: Optional token type hint.
      responses:
        '200':
          description: Introspection result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectionResponse'
        '400':
          description: Invalid introspection request.
        '401':
          description: Caller is not authenticated or token/caller credentials are invalid.
        '429':
          description: Caller exceeded introspection rate limits.
components:
  securitySchemes:
    clientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /connect/token
          scopes: {}
  schemas:
    IntrospectionResponse:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
        sub:
          type: string
          description: Token subject when active and available.
        permissions:
          type: array
          description: Fine-grained permissions filtered to the authenticated requesting API.
          items:
            type: string
      additionalProperties: true
