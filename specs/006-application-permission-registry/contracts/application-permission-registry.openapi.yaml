openapi: 3.1.0
info:
  title: OpenIdentityStack Application Permission Registry API
  version: 0.1.0
  description: Contract for Spec Kit feature 006. The contract uses full admin API paths because the feature spans application-permission and platform-permission resources.
servers:
  - url: /
security:
  - openIddictBearer: []
tags:
  - name: ApplicationPermissionApplications
  - name: ApplicationPermissionManifests
  - name: ApplicationPermissionCatalog
  - name: PlatformPermissionCatalog
  - name: ApplicationPermissionDeletion
  - name: ApplicationPermissionHistory
  - name: ApplicationPermissionDiagnostics
paths:
  /api/admin/application-permissions/applications:
    get:
      tags: [ApplicationPermissionApplications]
      operationId: listApplicationPermissionApplications
      summary: List current registered permission applications
      security:
        - openIddictBearer: [application-permissions:read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ApplicationPermissionApplicationStatus' }
        - name: ownerId
          in: query
          schema: { type: string, maxLength: 200 }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: includeDisabled
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Registered applications page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredApplicationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [ApplicationPermissionApplications]
      operationId: createApplicationPermissionApplication
      summary: Create a registered permission application from an inline manifest
      security:
        - openIddictBearer: [application-permissions:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRegisteredApplicationRequest' }
      responses:
        '201':
          description: Application created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredApplicationDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/application-permissions/applications/{applicationId}:
    get:
      tags: [ApplicationPermissionApplications]
      operationId: getApplicationPermissionApplication
      summary: Get registered permission application detail
      security:
        - openIddictBearer: [application-permissions:read]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - name: includeRemoved
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Application detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredApplicationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [ApplicationPermissionApplications]
      operationId: updateApplicationPermissionApplicationMetadata
      summary: Update IAM-managed application metadata
      security:
        - openIddictBearer: [application-permissions:write]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRegisteredApplicationRequest' }
      responses:
        '200':
          description: Application updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredApplicationDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [ApplicationPermissionDeletion]
      operationId: deleteApplicationPermissionApplication
      summary: Soft-delete an application and remove affected assignments
      security:
        - openIddictBearer: [application-permissions:admin]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteApplicationRequest' }
      responses:
        '200':
          description: Application deleted with impact result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DestructiveOperationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /api/admin/application-permissions/applications/{applicationId}/manifest/preview:
    post:
      tags: [ApplicationPermissionManifests]
      operationId: previewInlineApplicationPermissionManifest
      summary: Preview an inline manifest update without side effects
      security:
        - openIddictBearer: [application-permissions:read]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManifestUpdateRequest' }
      responses:
        '200':
          description: Manifest preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManifestPreviewResponse' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/application-permissions/applications/{applicationId}/manifest:
    post:
      tags: [ApplicationPermissionManifests]
      operationId: applyInlineApplicationPermissionManifest
      summary: Apply an inline manifest update
      security:
        - openIddictBearer: [application-permissions:write]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManifestUpdateRequest' }
      responses:
        '200':
          description: Manifest applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManifestApplyResponse' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /api/admin/application-permissions/applications/{applicationId}/import/preview:
    post:
      tags: [ApplicationPermissionManifests]
      operationId: previewRemoteApplicationPermissionManifest
      summary: Preview remote import from the registered manifestBaseUrl
      security:
        - openIddictBearer: [application-permissions:read]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoteImportRequest' }
      responses:
        '200':
          description: Remote manifest preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManifestPreviewResponse' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/admin/application-permissions/applications/{applicationId}/import:
    post:
      tags: [ApplicationPermissionManifests]
      operationId: applyRemoteApplicationPermissionManifest
      summary: Apply remote import from the registered manifestBaseUrl
      security:
        - openIddictBearer: [application-permissions:write]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoteImportRequest' }
      responses:
        '200':
          description: Remote manifest applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManifestApplyResponse' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /api/admin/application-permissions/applications/{applicationId}/disable:
    post:
      tags: [ApplicationPermissionApplications]
      operationId: disableApplicationPermissionApplication
      summary: Disable an application for new assignments
      security:
        - openIddictBearer: [application-permissions:admin]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StateChangeRequest' }
      responses:
        '200':
          description: Application disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredApplicationDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /api/admin/application-permissions/applications/{applicationId}/enable:
    post:
      tags: [ApplicationPermissionApplications]
      operationId: enableApplicationPermissionApplication
      summary: Re-enable an application for new assignments
      security:
        - openIddictBearer: [application-permissions:admin]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StateChangeRequest' }
      responses:
        '200':
          description: Application enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredApplicationDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /api/admin/application-permissions/applications/{applicationId}/deletion-impact:
    get:
      tags: [ApplicationPermissionDeletion]
      operationId: getApplicationPermissionApplicationDeletionImpact
      summary: Preview application deletion impact
      security:
        - openIddictBearer: [application-permissions:read]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: Deletion impact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionImpactResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/application-permissions/applications/{applicationId}/ownership:
    post:
      tags: [ApplicationPermissionApplications]
      operationId: transferApplicationPermissionApplicationOwnership
      summary: Transfer application ownership
      security:
        - openIddictBearer: [application-permissions:admin]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferOwnershipRequest' }
      responses:
        '200':
          description: Ownership transferred
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredApplicationDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /api/admin/application-permissions/applications/{applicationId}/maintainers:
    post:
      tags: [ApplicationPermissionApplications]
      operationId: addApplicationPermissionMaintainer
      summary: Add delegated maintainer
      security:
        - openIddictBearer: [application-permissions:write]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMaintainerRequest' }
      responses:
        '200':
          description: Maintainer added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredApplicationDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /api/admin/application-permissions/applications/{applicationId}/maintainers/{principalId}:
    delete:
      tags: [ApplicationPermissionApplications]
      operationId: removeApplicationPermissionMaintainer
      summary: Remove delegated maintainer
      security:
        - openIddictBearer: [application-permissions:write]
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - name: principalId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: concurrencyToken
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
        - name: reason
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Maintainer removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredApplicationDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /api/admin/application-permissions/catalog:
    get:
      tags: [ApplicationPermissionCatalog]
      operationId: listApplicationPermissionCatalog
      summary: List dynamic application permissions and derived aggregate wildcards
      security:
        - openIddictBearer: [application-permissions:read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: applicationIdentifier
          in: query
          schema: { type: string, pattern: '^[a-z][a-z0-9-]{2,62}$' }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: includeDisabled
          in: query
          schema: { type: boolean, default: false }
        - name: includeWildcards
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Dynamic catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationPermissionCatalogResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/permissions/platform:
    get:
      tags: [PlatformPermissionCatalog]
      operationId: listPlatformPermissionCatalog
      summary: List code-defined platform permissions for role-management workflows
      security:
        - openIddictBearer: [roles:read]
      parameters:
        - name: includeWildcards
          in: query
          schema: { type: boolean, default: true }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Platform permission catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformPermissionCatalogResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/application-permissions/permissions/{permissionId}:
    patch:
      tags: [ApplicationPermissionApplications]
      operationId: updateApplicationPermissionMetadata
      summary: Update current concrete permission metadata
      security:
        - openIddictBearer: [application-permissions:write]
      parameters:
        - $ref: '#/components/parameters/PermissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePermissionRequest' }
      responses:
        '200':
          description: Permission updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisteredApplicationDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [ApplicationPermissionDeletion]
      operationId: deleteApplicationPermission
      summary: Remove a current concrete permission and affected assignments
      security:
        - openIddictBearer: [application-permissions:admin]
      parameters:
        - $ref: '#/components/parameters/PermissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeletePermissionRequest' }
      responses:
        '200':
          description: Permission removed with impact result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DestructiveOperationResult' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /api/admin/application-permissions/permissions/{permissionId}/dependencies:
    get:
      tags: [ApplicationPermissionDeletion]
      operationId: getApplicationPermissionDependencies
      summary: Get current exact and wildcard assignment dependencies
      security:
        - openIddictBearer: [application-permissions:read]
      parameters:
        - $ref: '#/components/parameters/PermissionId'
      responses:
        '200':
          description: Dependencies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionDependenciesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/application-permissions/permissions/{permissionId}/deletion-impact:
    get:
      tags: [ApplicationPermissionDeletion]
      operationId: getApplicationPermissionDeletionImpact
      summary: Preview permission deletion impact
      security:
        - openIddictBearer: [application-permissions:read]
      parameters:
        - $ref: '#/components/parameters/PermissionId'
      responses:
        '200':
          description: Deletion impact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionImpactResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/application-permissions/permissions/{permissionId}/replacement:
    patch:
      tags: [ApplicationPermissionHistory]
      operationId: updateRemovedApplicationPermissionReplacement
      summary: Annotate removed permission replacement guidance
      security:
        - openIddictBearer: [application-permissions:admin]
      parameters:
        - $ref: '#/components/parameters/PermissionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplacementGuidanceRequest' }
      responses:
        '200':
          description: Replacement guidance updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemovedPermissionDetail' }
        '400': { $ref: '#/components/responses/ValidationProblem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/admin/application-permissions/history:
    get:
      tags: [ApplicationPermissionHistory]
      operationId: listApplicationPermissionHistory
      summary: List explicit deleted application and removed permission history
      security:
        - openIddictBearer: [application-permissions:admin]
      parameters:
        - name: applicationIdentifier
          in: query
          schema: { type: string, pattern: '^[a-z][a-z0-9-]{2,62}$' }
        - name: includeApplications
          in: query
          schema: { type: boolean, default: true }
        - name: includePermissions
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: History page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationPermissionHistoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/application-permissions/diagnostics:
    get:
      tags: [ApplicationPermissionDiagnostics]
      operationId: listApplicationPermissionDiagnostics
      summary: Report malformed, unknown, orphaned, deleted, and collapsed wildcard role permission data
      security:
        - openIddictBearer: [application-permissions:admin]
      responses:
        '200':
          description: Diagnostic issues
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionDiagnosticsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    openIddictBearer:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /connect/authorize
          tokenUrl: /connect/token
          scopes:
            application-permissions:read: Read application permission registry data
            application-permissions:write: Register and maintain owned or maintained application permissions
            application-permissions:admin: Perform registry administrator operations
            roles:read: Read role and platform permission catalog data
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PermissionId:
      name: permissionId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Authenticated principal lacks required permission or ownership boundary
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: Requested registry resource was not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Registry version, acknowledgement, duplicate, broad-grant, or destructive-change conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    PreconditionFailed:
      description: Supplied concurrency token is stale
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    ValidationProblem:
      description: Request validation failed without partial changes
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblemDetails' }
  schemas:
    ApplicationPermissionApplicationStatus:
      type: string
      enum: [active, disabled]
    PrincipalType:
      type: string
      enum: [user, group]
    CatalogPermissionKind:
      type: string
      enum: [concrete, wildcard, superAdmin]
    AssignmentImpactKind:
      type: string
      enum: [exactRemoved, wildcardRemoved, wildcardImpacted]
    IntegrityIssueKind:
      type: string
      enum: [malformed, unknown, orphaned, deletedApplication, tombstonedPermission, collapsedWildcard]
    CreateRegisteredApplicationRequest:
      type: object
      required: [manifest, ownerId, ownerType]
      properties:
        manifest: { $ref: '#/components/schemas/PermissionManifest' }
        ownerId: { type: string, minLength: 1, maxLength: 200 }
        ownerType: { $ref: '#/components/schemas/PrincipalType' }
        manifestBaseUrl: { type: string, format: uri }
        acknowledgeRedeclare: { type: boolean, default: false }
    PermissionManifest:
      type: object
      required: [schemaVersion, application, permissions]
      properties:
        schemaVersion:
          type: string
          const: 1.0.0
        application: { $ref: '#/components/schemas/PermissionManifestApplication' }
        permissions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PermissionManifestPermission' }
    PermissionManifestApplication:
      type: object
      required: [id, displayName, version]
      properties:
        id: { type: string, pattern: '^[a-z][a-z0-9-]{2,62}$', minLength: 3, maxLength: 63 }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        version:
          type: string
          description: SemVer 2.0.0 without build metadata. Prerelease versions are accepted.
          pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$'
    PermissionManifestPermission:
      type: object
      required: [key, displayName]
      properties:
        key: { type: string, pattern: '^[a-z][a-z0-9-]{1,62}:[a-z][a-z0-9-]{1,62}$' }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        category: { type: string, maxLength: 1000 }
    ManifestUpdateRequest:
      type: object
      required: [manifest, concurrencyToken]
      properties:
        manifest: { $ref: '#/components/schemas/PermissionManifest' }
        concurrencyToken: { type: integer, minimum: 0 }
        acknowledgeRedeclare: { type: boolean, default: false }
        acknowledgeWildcardImpact: { type: boolean, default: false }
    RemoteImportRequest:
      type: object
      properties:
        concurrencyToken: { type: integer, minimum: 0 }
        acknowledgeRedeclare: { type: boolean, default: false }
        acknowledgeWildcardImpact: { type: boolean, default: false }
    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        displayName: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        permissions:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
        acknowledgeWildcardGrant: { type: boolean, default: false }
      x-error-codes:
        broadGrantConflict: RolePermissions.BroadGrantAcknowledgementRequired
    SetRolePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { type: string, minLength: 1, maxLength: 200 }
        acknowledgeWildcardGrant: { type: boolean, default: false }
      x-error-codes:
        broadGrantConflict: RolePermissions.BroadGrantAcknowledgementRequired
    AddPermissionRequest:
      type: object
      required: [permission]
      properties:
        permission: { type: string, minLength: 1, maxLength: 200 }
        acknowledgeWildcardGrant: { type: boolean, default: false }
      x-error-codes:
        broadGrantConflict: RolePermissions.BroadGrantAcknowledgementRequired
    UpdateRegisteredApplicationRequest:
      type: object
      required: [concurrencyToken]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        manifestBaseUrl: { type: string, format: uri }
        reason: { type: string, minLength: 1, maxLength: 500 }
        concurrencyToken: { type: integer, minimum: 0 }
    StateChangeRequest:
      type: object
      required: [reason, concurrencyToken]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        concurrencyToken: { type: integer, minimum: 0 }
    TransferOwnershipRequest:
      type: object
      required: [ownerId, ownerType, reason, concurrencyToken]
      properties:
        ownerId: { type: string, minLength: 1, maxLength: 200 }
        ownerType: { $ref: '#/components/schemas/PrincipalType' }
        reason: { type: string, minLength: 1, maxLength: 500 }
        concurrencyToken: { type: integer, minimum: 0 }
    AddMaintainerRequest:
      type: object
      required: [principalId, principalType, reason, concurrencyToken]
      properties:
        principalId: { type: string, minLength: 1, maxLength: 200 }
        principalType: { $ref: '#/components/schemas/PrincipalType' }
        reason: { type: string, minLength: 1, maxLength: 500 }
        concurrencyToken: { type: integer, minimum: 0 }
    UpdatePermissionRequest:
      type: object
      required: [concurrencyToken]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        category: { type: string, maxLength: 1000 }
        concurrencyToken: { type: integer, minimum: 0 }
    DeletePermissionRequest:
      type: object
      required: [reason, concurrencyToken]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        concurrencyToken: { type: integer, minimum: 0 }
    DeleteApplicationRequest:
      type: object
      required: [reason, concurrencyToken]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        concurrencyToken: { type: integer, minimum: 0 }
    ReplacementGuidanceRequest:
      type: object
      required: [replacementFullPermissionKey, replacementNote, concurrencyToken]
      properties:
        replacementFullPermissionKey: { type: string, minLength: 1, maxLength: 200 }
        replacementNote: { type: string, minLength: 1, maxLength: 1000 }
        concurrencyToken: { type: integer, minimum: 0 }
    RegisteredApplicationListResponse:
      type: object
      required: [items, page, pageSize, totalCount, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RegisteredApplicationSummary' }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalCount: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    RegisteredApplicationSummary:
      type: object
      required: [id, applicationIdentifier, displayName, ownerId, ownerType, status, permissionCount, manifestVersion, createdAt, concurrencyToken]
      properties:
        id: { type: string, format: uuid }
        applicationIdentifier: { type: string }
        displayName: { type: string }
        description: { type: string }
        ownerId: { type: string }
        ownerType: { $ref: '#/components/schemas/PrincipalType' }
        status: { $ref: '#/components/schemas/ApplicationPermissionApplicationStatus' }
        permissionCount: { type: integer, minimum: 0 }
        manifestVersion: { type: string }
        manifestBaseUrl: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        concurrencyToken: { type: integer, minimum: 0 }
    RegisteredApplicationDetail:
      allOf:
        - $ref: '#/components/schemas/RegisteredApplicationSummary'
        - type: object
          required: [permissions, maintainers]
          properties:
            permissions:
              type: array
              items: { $ref: '#/components/schemas/ApplicationPermission' }
            maintainers:
              type: array
              items: { $ref: '#/components/schemas/DelegatedMaintainer' }
            disabledAt: { type: string, format: date-time }
            disabledBy: { type: string }
            disableReason: { type: string }
    ApplicationPermission:
      type: object
      required: [id, permissionKey, fullPermissionKey, displayName, createdAt, concurrencyToken]
      properties:
        id: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        applicationIdentifier: { type: string }
        permissionKey: { type: string }
        fullPermissionKey: { type: string }
        displayName: { type: string }
        description: { type: string }
        category: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        removedAt: { type: string, format: date-time }
        removedBy: { type: string }
        removeReason: { type: string }
        replacementFullPermissionKey: { type: string }
        replacementNote: { type: string }
        concurrencyToken: { type: integer, minimum: 0 }
    DelegatedMaintainer:
      type: object
      required: [id, principalId, principalType, grantedBy, grantedAt]
      properties:
        id: { type: string, format: uuid }
        principalId: { type: string }
        principalType: { $ref: '#/components/schemas/PrincipalType' }
        grantedBy: { type: string }
        grantedAt: { type: string, format: date-time }
        grantReason: { type: string }
    ApplicationPermissionCatalogResponse:
      type: object
      required: [items, page, pageSize, totalCount, totalPages]
      properties:
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/ApplicationPermissionCatalogItem'
              - $ref: '#/components/schemas/ApplicationPermissionWildcardCatalogItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalCount: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ApplicationPermissionCatalogItem:
      type: object
      required: [kind, id, applicationIdentifier, permissionKey, fullPermissionKey, displayName, assignable]
      properties:
        kind: { const: concrete }
        id: { type: string, format: uuid }
        applicationIdentifier: { type: string }
        permissionKey: { type: string }
        fullPermissionKey: { type: string }
        displayName: { type: string }
        description: { type: string }
        category: { type: string }
        assignable: { type: boolean }
        disabledReason: { type: string }
    ApplicationPermissionWildcardCatalogItem:
      type: object
      required: [kind, applicationIdentifier, resourceOrAggregate, fullPermissionKey, displayName, coveredPermissionCount, assignable]
      properties:
        kind: { const: wildcard }
        applicationIdentifier: { type: string }
        resourceOrAggregate: { type: string }
        fullPermissionKey: { type: string }
        displayName: { type: string }
        coveredPermissionCount: { type: integer, minimum: 1 }
        coveredPermissionSummary:
          type: array
          items: { type: string }
        assignable: { type: boolean }
        disabledReason: { type: string }
    PlatformPermissionCatalogResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PlatformPermissionCatalogItem' }
    PlatformPermissionCatalogItem:
      type: object
      required: [permission, resource, action, kind, displayName, assignable]
      properties:
        permission: { type: string }
        resource: { type: string }
        action: { type: string }
        kind: { $ref: '#/components/schemas/CatalogPermissionKind' }
        displayName: { type: string }
        description: { type: string }
        assignable: { type: boolean }
    ManifestPreviewResponse:
      type: object
      required: [applicationId, currentManifestVersion, requestedManifestVersion, hasChanges, versionWillAdvance, isDestructive, additions, metadataUpdates, removals, assignmentImpacts, warnings]
      properties:
        applicationId: { type: string, format: uuid }
        currentManifestVersion: { type: string }
        requestedManifestVersion: { type: string }
        hasChanges: { type: boolean }
        versionWillAdvance: { type: boolean }
        isDestructive: { type: boolean }
        callerCanApply: { type: boolean }
        additions:
          type: array
          items: { $ref: '#/components/schemas/ApplicationPermission' }
        metadataUpdates:
          type: array
          items: { $ref: '#/components/schemas/ApplicationPermission' }
        removals:
          type: array
          items: { $ref: '#/components/schemas/ApplicationPermission' }
        assignmentImpacts:
          type: array
          items: { $ref: '#/components/schemas/PermissionAssignmentImpact' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/OperationWarning' }
    ManifestApplyResponse:
      type: object
      required: [application, result]
      properties:
        application: { $ref: '#/components/schemas/RegisteredApplicationDetail' }
        result: { $ref: '#/components/schemas/DestructiveOperationResult' }
    DeletionImpactResponse:
      type: object
      required: [targetId, targetType, assignmentImpacts, warnings]
      properties:
        targetId: { type: string }
        targetType: { type: string, enum: [application, permission] }
        assignmentImpacts:
          type: array
          items: { $ref: '#/components/schemas/PermissionAssignmentImpact' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/OperationWarning' }
    DestructiveOperationResult:
      type: object
      required: [removedPermissions, exactAssignmentsRemoved, wildcardAssignmentsRemoved, wildcardAssignmentsImpacted, metadataUpdated, manifestVersionAdvanced]
      properties:
        removedPermissions:
          type: array
          items: { $ref: '#/components/schemas/ApplicationPermission' }
        exactAssignmentsRemoved:
          type: array
          items: { $ref: '#/components/schemas/PermissionAssignmentImpact' }
        wildcardAssignmentsRemoved:
          type: array
          items: { $ref: '#/components/schemas/PermissionAssignmentImpact' }
        wildcardAssignmentsImpacted:
          type: array
          items: { $ref: '#/components/schemas/PermissionAssignmentImpact' }
        metadataUpdated: { type: boolean }
        manifestVersionAdvanced: { type: boolean }
        auditId: { type: string }
    PermissionAssignmentImpact:
      type: object
      required: [assignmentStore, assignmentId, assignmentDisplayName, permission, impactKind]
      properties:
        assignmentStore: { type: string, enum: [role] }
        assignmentId: { type: string }
        assignmentDisplayName: { type: string }
        permission: { type: string }
        impactKind: { $ref: '#/components/schemas/AssignmentImpactKind' }
    PermissionDependenciesResponse:
      type: object
      required: [permissionId, fullPermissionKey, exactAssignments, wildcardAssignments]
      properties:
        permissionId: { type: string, format: uuid }
        fullPermissionKey: { type: string }
        exactAssignments:
          type: array
          items: { $ref: '#/components/schemas/PermissionAssignmentImpact' }
        wildcardAssignments:
          type: array
          items: { $ref: '#/components/schemas/PermissionAssignmentImpact' }
    RemovedPermissionDetail:
      allOf:
        - $ref: '#/components/schemas/ApplicationPermission'
        - type: object
          required: [removedAt, removedBy, removeReason]
    ApplicationPermissionHistoryResponse:
      type: object
      required: [deletedApplications, removedPermissions]
      properties:
        deletedApplications:
          type: array
          items: { $ref: '#/components/schemas/RegisteredApplicationSummary' }
        removedPermissions:
          type: array
          items: { $ref: '#/components/schemas/RemovedPermissionDetail' }
    PermissionDiagnosticsResponse:
      type: object
      required: [issues]
      properties:
        issues:
          type: array
          items: { $ref: '#/components/schemas/PermissionDiagnosticIssue' }
    PermissionDiagnosticIssue:
      type: object
      required: [kind, assignmentStore, assignmentId, permission, message]
      properties:
        kind: { $ref: '#/components/schemas/IntegrityIssueKind' }
        assignmentStore: { type: string, enum: [role] }
        assignmentId: { type: string }
        assignmentDisplayName: { type: string }
        permission: { type: string }
        message: { type: string }
    OperationWarning:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        permission: { type: string }
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        code: { type: string }
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
