server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_types
    text/css
    text/javascript
    text/plain
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # Vite emits content-hashed files under /assets/, so they can be cached indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Written by docker-entrypoint.sh at container start; must never be cached.
  location = /runtime-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # The entry document references hashed assets and must always be revalidated.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback. add_header is not inherited across location blocks, so the
  # no-cache header is repeated here for the internally served index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
